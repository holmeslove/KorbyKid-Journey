<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbyKid Journey</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="960" height="540"></canvas>

    <!-- Title and Play button. Hidden until the intro animation finishes. -->
    <div id="menu" class="hidden">
      <h1>KorbyKid Journey</h1>
      <button id="play-button">Play</button>
      <button id="characters-button">Characters</button>
    </div>

    <!-- Characters screen, opened from the title screen -->
    <div id="characters-screen" hidden>
      <h2 class="characters-title">Characters</h2>
      <div id="characters-grid"></div>
      <button id="characters-back-button">Back</button>
    </div>

    <!-- Continue button in the center of the death screen. Shown after the last heart is lost. -->
    <button id="continue-button" hidden>Continue</button>
    <button id="title-button" hidden>Return to Title</button>
  </div>

  <!-- On-screen buttons for phones and tablets. Hidden on computers (see style.css). -->
  <div id="touch-controls">
    <div class="touch-group">
      <button class="touch-button" data-control="left" aria-label="Walk left">&#9664;</button>
      <button class="touch-button" data-control="right" aria-label="Walk right">&#9654;</button>
    </div>
    <div class="touch-group">
      <button class="touch-button" data-control="attack" aria-label="Attack">Attack</button>
      <button class="touch-button" data-control="jump" aria-label="Jump">Jump</button>
    </div>
  </div>

  <!-- Red border shown around the whole window when KorbyKid is hurt -->
  <div id="damage-flash"></div>

  <script src="game.js"></script>
</body>
</html>
