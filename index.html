<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbyKid Journey</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="960" height="540"></canvas>

    <!-- Title and Play button. Hidden until the intro animation finishes. -->
    <div id="menu" class="hidden">
      <h1>KorbyKid Journey</h1>
      <button id="play-button">Play</button>
    </div>

    <!-- Continue button in the center of the death screen. Shown after the last heart is lost. -->
    <button id="continue-button" hidden>Continue</button>
  </div>

  <!-- Red border shown around the whole window when KorbyKid is hurt -->
  <div id="damage-flash"></div>

  <script src="game.js"></script>
</body>
</html>
